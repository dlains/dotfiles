# Location of mpd database.
db_file "~/.config/mpd/database"
pid_file "~/.config/mpd/pid"

# Setup my local music directory.
music_directory "~/Music"

# Store the playlists in the local config directory.
playlist_directory "~/.config/mpd/playlists"

# Update when files change in the music directory.
auto_update "yes"

follow_outside_symlinks "no"
follow_inside_symlinks "no"
log_level "warning"

